<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Еда.Быстро — Заказ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="brand-header"><h1>Заказ</h1><p>Доставка еды на дом</p></header>
    <div class="card-panel">
      <div id="form-alert" class="alert alert-inline d-none"></div>
      <form id="record-form">
        <div class="mb-3">
          <label class="form-label">Адрес доставки</label>
          <input class="form-control" name="address" required />
          <div id="address-hint" class="form-hint"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Блюдо</label>
          <select class="form-select" name="dish" required>
            <option value="">Выберите...</option>
            <option value="pizza">Пицца</option>
            <option value="sushi">Суши</option>
            <option value="burger">Бургер</option>
          </select>
          <div id="dish-hint" class="form-hint"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Время доставки</label>
          <input class="form-control" name="delivery_time" placeholder="ДД.ММ.ГГГГ" pattern="\d{2}\.\d{2}\.\d{4}" required />
          <div id="delivery_time-hint" class="form-hint"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Сумма, ₽</label>
          <input class="form-control" name="total" type="number" required />
          <div id="total-hint" class="form-hint"></div>
        </div>
        <button type="submit" class="btn btn-brand">Отправить</button>
      </form>
      <a class="nav-link-soft" href="/cabinet.html">Личный кабинет</a>
    </div>
  </div>
  <script type="module" src="/src/pages/create.js"></script>
</body>
</html>
